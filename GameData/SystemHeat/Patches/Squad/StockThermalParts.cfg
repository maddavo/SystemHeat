// Stock ISRU and drills use KSP's legacy core-heat modules by default.
// Convert them to the native SystemHeat modules so their heat appears in the
// Heat Management window and participates in user-selected heat loops.

@PART[ISRU,MiniISRU]:FINAL
{
  !MODULE[ModuleCoreHeat] {}
  !MODULE[ModuleOverheatDisplay] {}
  MODULE
  {
    name = ModuleSystemHeat
    volume = 10
    moduleID = isru
    iconName = Icon_Gears
  }

  @MODULE[ModuleResourceConverter]:HAS[@INPUT_RESOURCE:HAS[#ResourceName[ElectricCharge]]]
  {
    @name = ModuleSystemHeatConverter
    moduleID = #$ConverterName$
    systemHeatModuleID = isru
    shutdownTemperature = 800
    systemOutletTemperature = 600
    systemEfficiency
    {
      key = 0 0
      key = 300 1
      key = 1000 1
      key = 1300 0
    }
    systemPower = #$INPUT_RESOURCE:HAS[#ResourceName[ElectricCharge]]/Ratio$
    @systemPower *= 0.9
    !ThermalEfficiency {}
    !TemperatureModifier {}
    @GeneratesHeat = false
  }
}

@PART[RadialDrill,MiniDrill]:FINAL
{
  !MODULE[ModuleCoreHeat] {}
  !MODULE[ModuleOverheatDisplay] {}
  MODULE
  {
    name = ModuleSystemHeat
    volume = 1
    moduleID = harvester
    iconName = Icon_Drill
  }

  @MODULE[ModuleResourceHarvester]:HAS[@INPUT_RESOURCE:HAS[#ResourceName[ElectricCharge]]]
  {
    @name = ModuleSystemHeatHarvester
    moduleID = #$ConverterName$
    systemHeatModuleID = harvester
    shutdownTemperature = 750
    systemOutletTemperature = 350
    systemEfficiency
    {
      key = 0 1
      key = 400 1
      key = 650 0
    }
    systemPower = #$INPUT_RESOURCE:HAS[#ResourceName[ElectricCharge]]/Ratio$
    !ThermalEfficiency {}
    !TemperatureModifier {}
    @GeneratesHeat = false
  }
}
