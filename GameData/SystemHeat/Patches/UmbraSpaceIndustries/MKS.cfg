// MKS uses USI's dynamic converter and harvester modules.  Keep those modules
// intact and add bridges so their live EC process load appears in SystemHeat.

@PART[*]:HAS[@MODULE[USI_Converter]]:FINAL
{
  !MODULE[ModuleCoreHeat] {}
  !MODULE[ModuleOverheatDisplay] {}
  MODULE
  {
    name = ModuleSystemHeat
    volume = #$mass$
    @volume *= 0.5
    moduleID = mks
    iconName = Icon_Gears
  }
  MODULE
  {
    name = ModuleSystemHeatUSIConverter
    moduleID = mksConverter
    systemHeatModuleID = mks
    heatMultiplier = 0.9
    systemOutletTemperature = 600
  }
}

@PART[*]:HAS[@MODULE[USI_Harvester]]:FINAL
{
  !MODULE[ModuleCoreHeat] {}
  !MODULE[ModuleOverheatDisplay] {}
  MODULE
  {
    name = ModuleSystemHeat
    volume = #$mass$
    @volume *= 0.5
    moduleID = mks
    iconName = Icon_Drill
  }
  MODULE
  {
    name = ModuleSystemHeatUSIHarvester
    moduleID = mksHarvester
    systemHeatModuleID = mks
    heatMultiplier = 1
    systemOutletTemperature = 350
  }
}

@PART[*]:HAS[@MODULE[ModuleHeatPump]]:FINAL
{
  MODULE
  {
    name = ModuleSystemHeat
    volume = #$mass$
    @volume *= 0.5
    moduleID = mks
    iconName = Icon_Radiator
  }
  MODULE
  {
    name = ModuleSystemHeatUSIHeatPump
    moduleID = mksHeatPump
    systemHeatModuleID = mks
  }
}
